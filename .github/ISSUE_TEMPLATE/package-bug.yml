name: "Map or mod bug / Błąd paczki"
description: "Report a map, mod or asset-pack compatibility problem."
title: "[package-bug] "
body:
  - type: markdown
    attributes:
      value: "English or Polish welcome. Search existing issues first. Reports and attachments are public; remove personal or secret data."
  - type: input
    id: version
    attributes:
      label: "Game, editor and package versions / Wersje gry, edytora i paczki"
      description: "Use exact versions, not latest."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Operating system and hardware / System i sprzęt"
      description: "Include GPU and RAM for rendering or performance problems."
    validations:
      required: true
  - type: textarea
    id: packages
    attributes:
      label: "Map, mods and dependencies / Mapa, mody i zależności"
      description: "List IDs, versions and source URLs, or write none. For a package bug, identify the affected package and author."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to reproduce / Kroki odtworzenia"
      placeholder: "1. Start with…\n2. Open…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected result / Oczekiwany wynik"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual result / Faktyczny wynik"
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: "Reproducibility / Powtarzalność"
      options:
        - "Always / Zawsze"
        - "Sometimes / Czasami"
        - "Once / Jeden raz"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Logs, screenshots and minimal save/map / Logi, obrazki i mały zapis"
      description: "Attach only material you can share publicly. Include error text and whether the issue occurs without optional mods. Never attach credentials."
  - type: checkboxes
    id: checks
    attributes:
      label: "Before submitting / Przed wysłaniem"
      options:
        - label: "I searched existing reports / Sprawdziłem istniejące zgłoszenia."
          required: true
        - label: "I checked attachments for private information / Sprawdziłem załączniki pod kątem prywatnych danych."
          required: true
